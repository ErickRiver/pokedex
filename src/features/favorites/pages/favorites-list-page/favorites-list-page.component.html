<section class="favorites-list-page">
  <div class="favorites-list-page__search-container">
    <app-pokemon-search [isFavorites]="true" (search)="onSearch($event)" />
    <p class="favorites-list-page__count">{{ 'favorites.list.title' | translate }}: {{ favoriteCount }} </p>
  </div>

  <app-pokemon-list [isFavorites]="true" [searchQuery]="searchQuery()" />

  <img [src]="pokeballStarImage" alt="pokeball" class="favorites-list-page__pokeball" />
</section>
