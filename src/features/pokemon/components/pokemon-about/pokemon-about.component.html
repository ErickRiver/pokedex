@if (versionDescriptions().length) {
<div class="pokemon-about__versions-nav">
  <button type="button" class="pokemon-about__versions-previous" (click)="scrollVersions(-1)"
    aria-label="Scroll versions left"><i class="fa-solid fa-chevron-left"></i></button>
  <div #versionsScroll class="pokemon-about__versions">
    @for (version of versionDescriptions(); track version.version) {
    <p class="pokemon-about__versions-item"
      [class.active]="selectedVersion()?.flavor_text === version.flavor_text || (!selectedVersion()?.flavor_text && $first)"
      (click)="setVersionDescription(version.version, version.flavor_text)">{{ version.version }}</p>
    }
  </div>
  <button type="button" class="pokemon-about__versions-next" (click)="scrollVersions(1)"
    aria-label="Scroll versions right"><i class="fa-solid fa-chevron-right"></i></button>
</div>

<p class="pokemon-about__description">{{ versionDescription() }}</p>
<p class="pokemon-about__region">{{ 'pokemon.region.title' | translate }}: {{ generation() }}</p>
} @else {
<p class="pokemon-about__versions-item">{{ 'pokemon.about.empty' | translate }}</p>
}
