<article class="pokemon-card {{ type() }}" [routerLink]="['/pokemon', pokemon().name]" (click)="onSelect()">
  <p class="pokemon-card-id-back">{{ pokemon().id | pokemonId }}</p>
  <div class="pokemon-card-image">
    <img [src]="imageUrl()" [alt]="pokemon().name" appImgFallback />
  </div>
  <div class="pokemon-card-info">
    <div class="name-container">
      <app-favorite-toggle [pokemonId]="pokemon().id"  />
      <h3 class="pokemon-card-name">{{ displayName() }}</h3>      
    </div>

    <app-pokemon-types [types]="pokemon().types" />
  </div>
</article>
